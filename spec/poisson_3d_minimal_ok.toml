# Minimal 3D Poisson problem case spec.
#
# This spec is schema valid and should pass capability audit and solve.

[problem]
name = "Poisson 3D minimal"

[mesh]
dimension = 3

[[fields]]
name = "u"
kind = "scalar"
space = "H1"
complex = false

[equation]
type = "poisson"

[[bcs]]
type = "dirichlet"
field = "u"
value = 0.0

[solver]
linear = "cg"
precond = "jacobi"
